<header class="appbar">
  <a class="brand" routerLink="/pokedex" aria-label="Inicio">
    <span class="brand__ball" aria-hidden="true"></span>
    <span class="brand__text">
      <strong>Pokémon</strong>
      <small>TCG · XY1</small>
    </span>
  </a>

  @if (isAuthenticated()) {
    <nav class="nav" aria-label="Secciones">
      @for (item of items; track item.path) {
        <a
          class="nav__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [attr.aria-label]="item.label"
        >
          <span class="nav__icon" aria-hidden="true">
            @switch (item.path) {
              @case ('/pokedex') {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
              }
              @case ('/deck-builder') {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/><path d="M7 9v11"/><path d="M17 9v11"/>
                </svg>
              }
              @case ('/lobby') {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              }
            }
          </span>
          <span class="nav__label">{{ item.label }}</span>
        </a>
      }
    </nav>
  }

  <div class="auth-section">
    @if (isAuthenticated()) {
      <span class="auth-section__user">{{ currentUser()?.username }}</span>
      <a class="auth-section__link" routerLink="/profile" routerLinkActive="is-active">
        Profile
      </a>
      <button class="auth-section__logout" (click)="logout()">Logout</button>
    } @else {
      <a class="auth-section__link" routerLink="/login" routerLinkActive="is-active">
        Login
      </a>
      <span class="auth-section__sep">|</span>
      <a class="auth-section__link" routerLink="/register" routerLinkActive="is-active">
        Register
      </a>
    }
  </div>
</header>
