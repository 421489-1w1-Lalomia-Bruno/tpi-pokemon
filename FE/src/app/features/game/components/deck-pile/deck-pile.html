<div class="pile" [class.pile--empty]="isEmpty()" [attr.aria-label]="label() + ': ' + count() + ' cartas'">
  <div class="pile__stack">
    @if (!isEmpty()) {
      @for (i of [3, 2, 1, 0]; track i) {
        <div class="pile__card-back" [style.z-index]="i" [style.transform]="'translateY(' + (i * 2) + 'px) rotate(' + ((i % 2 === 0 ? 1 : -1) * 0.5) + 'deg)'"></div>
      }
    } @else {
      <div class="pile__card-back pile__card-back--empty"></div>
    }
  </div>
  <span class="pile__count">{{ count() }}</span>
  <span class="pile__label">{{ label() }}</span>
</div>
