<div class="toast-container" role="status" aria-live="polite">
  @if (gameState.error()) {
    <div class="toast toast--error">
      <svg class="toast__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/>
      </svg>
      <span class="toast__message">{{ gameState.error() }}</span>
      <button class="toast__close" (click)="gameState.clearError()" aria-label="Cerrar error">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
  @if (gameState.notification()) {
    <div class="toast toast--info">
      <svg class="toast__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
      <span class="toast__message">{{ gameState.notification() }}</span>
      <button class="toast__close" (click)="gameState.clearNotification()" aria-label="Cerrar notificación">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
  @if (eventToast(); as evt) {
    <div class="toast toast--event" role="alert">
      <svg class="toast__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
        @switch (eventIcon(evt.type)) {
          @case ('ko') {
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          }
          @case ('prize') {
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          }
          @case ('ability') {
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          }
          @case ('mulligan') {
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          }
          @case ('condition') {
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
          }
          @case ('coin') {
            <circle cx="12" cy="12" r="9"/><path d="M12 6v12M6 12h12"/>
          }
          @case ('card') {
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>
          }
          @default {
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
          }
        }
      </svg>
      <span class="toast__message">
        <span class="toast__actor" [class.toast__actor--self]="evt.playerId === gameState.myPlayerId()">
          {{ actorLabel(evt) }}
        </span>
        {{ evt.description }}
      </span>
      <button class="toast__close" (click)="clearEventToast()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
