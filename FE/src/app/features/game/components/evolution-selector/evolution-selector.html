@if (show()) {
<div class="selector-overlay" (click)="cancel.emit()">
  <div class="selector-modal" (click)="$event.stopPropagation()">
    <div class="selector-modal__header">
      <h2>Seleccioná una evolución</h2>
      <button type="button" class="selector-modal__close" (click)="cancel.emit()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="selector-modal__grid">
      @for (pair of pairs(); track pair.evolution.id; let i = $index) {
      <button class="selector-modal__card" (click)="pairSelected.emit(i)">
        <div class="evo-from">
          <span class="evo-label">Evoluciona de</span>
          <span class="evo-name">{{ pair.target.card.name }}</span>
          <span class="evo-hp">HP {{ pair.target.currentHp }}/{{ pair.target.card.hp }}</span>
        </div>
        <div class="evo-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
        </div>
        <div class="evo-to">
          <span class="evo-name">{{ pair.evolution.name }}</span>
          <span class="evo-hp">HP {{ pair.evolution.hp }}</span>
          <span class="evo-stage">{{ pair.evolution.stage }}</span>
        </div>
      </button>
      }
    </div>
  </div>
</div>
}
