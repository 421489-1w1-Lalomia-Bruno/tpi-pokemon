@if (show()) {
<div class="selector-overlay" (click)="cancel.emit()">
  <div class="selector-modal" (click)="$event.stopPropagation()">
    <div class="selector-modal__header">
      <h2>Seleccioná un ataque</h2>
      <button type="button" class="selector-modal__close" (click)="cancel.emit()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="selector-modal__grid">
      @for (attack of attacks(); track attack.name; let i = $index) {
      <button class="selector-modal__card" (click)="attackSelected.emit(i)">
        <div class="attack-name">{{ attack.name }}</div>
        <div class="attack-cost">
          @for (energy of attack.cost; track energy) {
          <span class="attack-cost__badge" [attr.data-type]="energy" [title]="energy | energyType:'label'"></span>
          }
        </div>
        <div class="attack-damage">{{ attack.damage }}</div>
        @if (attack.effectText) {
        <div class="attack-effect">{{ attack.effectText }}</div>
        }
      </button>
      }
    </div>
  </div>
</div>
}
