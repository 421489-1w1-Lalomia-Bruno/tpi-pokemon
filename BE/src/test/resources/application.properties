##### Application properties #####
spring.profiles.active=test
app.name='@project.name@'
app.desc='@project.description@'
app.version='@project.version@'
app.url=http://localhost:8080
app.dev-name=John Doe
app.dev-email=dumy@dumy

##### SpringDoc #####
springdoc.packages-to-scan=ar.edu.utn.frc.tup.piii.controllers
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html

##### Embedded PostgreSQL (Tests) - Zonky provides auto-config #####
# spring.datasource.url is not set - zonky embedded postgres will provide it

##### JPA (Tests) #####
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

##### Flyway (Tests) #####
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

##### Disable Spring Security for tests #####
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

##### Pokemon TCG API (empty for tests) #####
pokemon.api.key=
pokemon.api.base-url=https://api.pokemontcg.io/v2

##### Cache Configuration (Caffeine) for tests #####
app.cache.cards.max-size=500
app.cache.cards.ttl-days=14

##### Sync Scheduler (disabled in tests) #####
app.sync.cron=-
app.sync.interval-days=14
app.sync.set-id=xy1

##### Logging #####
logging.level.root=WARN
