##### Application properties #####
app.name=@project.name@
app.desc=@project.description@
app.version=@project.version@
app.url=http://localhost:8080
app.dev-name=John Doe
app.dev-email=dumy@dumy

#####  SPRING DOC PROPERTIES #####
springdoc.packages-to-scan=ar.edu.utn.frc.tup.piii.controllers
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

##### Active Profile #####
spring.profiles.active=dev

##### Logging #####
logging.level.root=WARN
logging.level.ar.edu.utn.frc.tup.piii.engine=INFO

##### JWT Configuration #####
jwt.secret=default-secret-key-change-in-production-must-be-256-bits-minimum
jwt.expiration-ms=3600000

##### Pokemon TCG API #####
pokemon.api.key=${POKEMON_TCG_API_KEY:307c341f-3f91-4f04-b234-e5f803c66597}
pokemon.api.base-url=https://api.pokemontcg.io/v2

##### Cache Configuration (Caffeine) #####
spring.cache.type=caffeine
app.cache.cards.max-size=500
app.cache.cards.ttl-days=14

##### Scheduler Configuration #####
app.sync.cron=0 0 0 ? * SUN
app.sync.interval-days=14
app.sync.set-id=xy1

##### CORS Configuration #####
app.cors.allowed-origins=http://localhost:4200
